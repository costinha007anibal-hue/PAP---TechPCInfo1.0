<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TechPCInfo – Definições</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-100">
  <nav class="brand-gradient text-white px-4 py-3 flex items-center justify-between">
    <a href="/dashboard.html" class="font-bold text-lg">← TechPCInfo</a>
    <span class="text-sm">Definições</span>
  </nav>
  <main class="max-w-md mx-auto p-4 md:p-6 space-y-4">
    <div class="card p-6">
      <h1 class="font-bold text-slate-800 mb-3">Sessão</h1>
      <dl class="text-sm space-y-2" id="info"></dl>
      <button id="logout" class="btn-ghost mt-4 w-full">Terminar sessão</button>
    </div>
    <div class="card p-6 text-sm text-slate-600">
      <p><strong>Protótipo Etapa 1</strong> – ideias incorporadas:</p>
      <ul class="list-disc ml-5 mt-2 space-y-1">
        <li>Câmara QR só em dispositivos móveis detetados</li>
        <li>Base de dados SQLite no protótipo (schema alinhado com futura migração PostgreSQL)</li>
        <li>Logins e PCs de demonstração pré-carregados</li>
      </ul>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    const s = TechPC.requireAuth();
    if (!s) throw new Error("auth");
    document.getElementById("info").innerHTML = `
      <div><span class="text-slate-400">Nome</span> · ${TechPC.escapeHtml(s.display_name)}</div>
      <div><span class="text-slate-400">Email</span> · ${TechPC.escapeHtml(s.email)}</div>
      <div><span class="text-slate-400">Papel</span> · ${TechPC.escapeHtml(s.role)}</div>
    `;
    document.getElementById("logout").onclick = () => {
      TechPC.clearSession();
      location.href = "/index.html";
    };
  </script>
</body>
</html>
