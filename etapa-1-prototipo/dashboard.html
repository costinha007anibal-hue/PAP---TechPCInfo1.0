<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TechPCInfo – Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-100">
  <nav class="brand-gradient text-white px-4 py-3 flex flex-wrap items-center justify-between gap-2">
    <div class="font-bold text-lg tracking-tight">TechPCInfo</div>
    <div class="flex flex-wrap items-center gap-2 text-sm">
      <a href="/dashboard.html" class="px-3 py-1 rounded-lg bg-white/20">Dashboard</a>
      <a href="/scan.html" class="px-3 py-1 rounded-lg hover:bg-white/10">Pesquisar / QR</a>
      <a href="/admin.html" id="navAdmin" class="px-3 py-1 rounded-lg hover:bg-white/10 hidden">Admin</a>
      <a href="/settings.html" class="px-3 py-1 rounded-lg hover:bg-white/10">Definições</a>
      <button id="btnLogout" class="px-3 py-1 rounded-lg hover:bg-white/10">Sair</button>
    </div>
  </nav>
  <main class="max-w-5xl mx-auto p-4 md:p-6">
    <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-slate-800">Equipamentos</h1>
        <p class="text-slate-500 text-sm" id="greeting">—</p>
      </div>
      <input type="search" id="search" placeholder="Pesquisar nome, sala, código…"
        class="border border-slate-200 rounded-xl px-4 py-2 w-full sm:w-72 focus:outline-none focus:ring-2 focus:ring-teal-600/40" />
    </div>
    <div id="stats" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6"></div>
    <div id="list" class="space-y-3"></div>
  </main>
  <script src="/js/app.js"></script>
  <script>
    const session = TechPC.requireAuth();
    if (!session) throw new Error("auth");
    document.getElementById("greeting").textContent = `Olá, ${session.display_name} (${session.role})`;
    if (session.role === "admin") document.getElementById("navAdmin").classList.remove("hidden");
    document.getElementById("btnLogout").onclick = () => { TechPC.clearSession(); location.href = "/index.html"; };
    let all = [];
    function render(list) {
      const el = document.getElementById("list");
      if (!list.length) { el.innerHTML = `<div class="card p-8 text-center text-slate-500">Nenhum equipamento encontrado.</div>`; return; }
      el.innerHTML = list.map((pc) => `
        <a href="/pc-detail.html?id=${encodeURIComponent(pc.code)}" class="card p-4 flex flex-wrap items-center gap-4 hover:shadow-md transition">
          <div class="w-12 h-12 rounded-xl bg-slate-100 flex items-center justify-center text-slate-400 text-xl">💻</div>
          <div class="flex-1 min-w-[12rem]">
            <div class="font-semibold text-slate-800">${TechPC.escapeHtml(pc.name)}</div>
            <div class="text-sm text-slate-500">${TechPC.escapeHtml(pc.code)} · ${TechPC.escapeHtml(pc.location || "—")}</div>
          </div>
          <div class="text-sm text-slate-600">${TechPC.escapeHtml(pc.brand || "")} ${TechPC.escapeHtml(pc.model || "")}</div>
          ${TechPC.statusBadge(pc.status)}
        </a>`).join("");
    }
    function updateStats(list) {
      const total = list.length;
      const ativo = list.filter((p) => p.status === "ativo").length;
      const man = list.filter((p) => p.status === "manutencao").length;
      const inat = list.filter((p) => p.status === "inativo").length;
      document.getElementById("stats").innerHTML = [
        ["Total", total, "bg-white"], ["Ativos", ativo, "bg-emerald-50"],
        ["Manutenção", man, "bg-amber-50"], ["Inativos", inat, "bg-slate-50"],
      ].map(([label, n, bg]) => `<div class="card p-4 ${bg}"><div class="text-2xl font-bold text-slate-800">${n}</div><div class="text-xs text-slate-500 uppercase tracking-wide">${label}</div></div>`).join("");
    }
    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = !q ? all : all.filter((p) => [p.name, p.code, p.location, p.brand, p.model].join(" ").toLowerCase().includes(q));
      render(filtered);
    });
    TechPC.apiGet("/equipment").then((data) => { all = data; updateStats(all); render(all); })
      .catch((e) => { document.getElementById("list").innerHTML = `<div class="card p-6 text-red-600">Erro: ${TechPC.escapeHtml(e.message)}</div>`; });
  </script>
</body>
</html>
